plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.nivo.volume'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.nivo.volume'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
