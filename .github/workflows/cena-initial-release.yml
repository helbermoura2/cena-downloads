name: Publicar CENA 0.15.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cena-initial-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obter e conferir o APK já assinado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2714-820e-bfa3-edabdd95948f/raw?se=2026-11-10T19%3A23%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=4dccc448-08e9-42c6-aecf-0a2ca13145b9&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T23%3A43%3A59Z&ske=2026-11-10T23%3A43%3A59Z&sks=b&skv=2026-02-06&sig=smy7szdwOAg2gWslXgQOGRfZqJO976MLR12C81KHif4%3D'
        run: |
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/cena.zip
          unzip -j /tmp/cena.zip 'CENA-0.15.0.apk' -d /tmp/cena
          printf '%s  %s\n' 'df82c9ffe62af4bb5818e23806c653e42e260d013f654caf637eb5e9ab29f525' '/tmp/cena/CENA-0.15.0.apk' | sha256sum --check
      - name: Publicar APK inicial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.15.0 /tmp/cena/CENA-0.15.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CENA 0.15.0' --notes 'Versão de teste para Android. Instale sobre a versão existente para manter seus dados.'
