name: NIVO Volume - APK de teste gratuito
on:
  workflow_dispatch:
    inputs:
      publish_test:
        description: Publicar APK de teste como prévia
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nivo-build-test
  cancel-in-progress: false
jobs:
  build:
    name: Compilar NIVO sem alterar CENA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar ferramentas Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK API 35
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK debug assinado para teste
        run: gradle --no-daemon -p volume-assistido :app:assembleDebug --stacktrace
      - name: Verificar estrutura do APK e gerar checksum
        run: |
          set -euo pipefail
          APK=volume-assistido/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          mkdir -p output
          VERSION=$(awk -F"'" '/versionName/{print $2; exit}' volume-assistido/app/build.gradle)
          test -n "$VERSION"
          FILE="NIVO-Volume-$VERSION-teste.apk"
          cp "$APK" "output/$FILE"
          cd output && sha256sum "$FILE" > SHA256SUMS.txt
      - name: Guardar APK debug apenas como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: NIVO-debug-nao-usar-como-atualizacao
          path: output/
          retention-days: 7
  publish-test:
    if: inputs.publish_test && github.repository == 'helbermoura2/cena-downloads' && github.ref_name == 'feat/nivo-volume-sidebar'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NIVO-debug-nao-usar-como-atualizacao
          path: output
      - name: Publicar download direto do APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd output
          sha256sum -c SHA256SUMS.txt
          gh release create nivo-volume-v0.6.0-test NIVO-Volume-0.6.0-teste.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title 'NIVO Volume 0.6.0 · teste' \
            --notes 'APK de teste do NIVO com barra lateral e botões separados. A assinatura de teste pode impedir a instalação por cima da versão 0.4.0.'
