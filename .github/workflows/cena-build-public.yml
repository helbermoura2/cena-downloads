name: CENA Android — compilar, testar e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/cena-build-trigger.txt']
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verificar acesso privado
        env:
          PRIVATE_ACCESS: ${{ secrets.CENA_PRIVATE_ACCESS }}
        run: |
          if [ -z "$PRIVATE_ACCESS" ]; then
            echo 'Configure o segredo CENA_PRIVATE_ACCESS neste repositório.'
            exit 1
          fi
      - name: Baixar revisão privada do CENA
        uses: actions/checkout@v4
        with:
          repository: helbermoura2/teclado-br
          ref: '3c254bba8cd56f2c6616f7a4d3f5701a74d3dd58'
          token: ${{ secrets.CENA_PRIVATE_ACCESS }}
          persist-credentials: false
          path: source
      - name: Liberar espaço no executor temporário
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testar código e navegação
        working-directory: source/cena
        run: |
          npm run check
          npm test
          node scripts/check-cover-identification.mjs
          python3 -m venv /tmp/cena-browser
          /tmp/cena-browser/bin/pip install --quiet playwright pyyaml pillow
          /tmp/cena-browser/bin/python scripts/check-navigation-browser.py
          /tmp/cena-browser/bin/python scripts/check-recent-history-browser.py
          /tmp/cena-browser/bin/python scripts/check-streaming-browser.py
      - name: Executar validação completa no navegador
        run: |
          /tmp/cena-browser/bin/python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('source/.github/workflows/cena-browser-qa.yml').read_text()); s=next(x['run'] for x in d['jobs']['mobile-search']['steps'] if x.get('name')=='Search SISU online and save to the local watchlist'); pathlib.Path('/tmp/cena-browser-qa.sh').write_text(s)"
          cd source/cena
          bash /tmp/cena-browser-qa.sh
      - name: Preparar SDK e modelos
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          python3 source/cena/scripts/prepare-vision-model.py
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git /tmp/cena-llama
          git -C /tmp/cena-llama fetch --depth 1 origin 0ec4027a2a0183de87c007069adddc06e665f7de
          git -C /tmp/cena-llama checkout --detach FETCH_HEAD
          mkdir -p source/cena/android/app/src/main/assets/licenses
          cp /tmp/cena-llama/LICENSE source/cena/android/app/src/main/assets/licenses/llama.cpp.txt
          bash source/cena/scripts/build-local-ai.sh source/cena /tmp/cena-llama
          bash source/cena/scripts/trim-native.sh source/cena
      - name: Obter assinatura e versão anterior para teste
        env:
          GH_TOKEN: ${{ secrets.CENA_PRIVATE_ACCESS }}
        run: |
          mkdir -p "$RUNNER_TEMP/cena-signing" /tmp/cena-previous
          gh release download cena-internal-signing --repo helbermoura2/teclado-br --pattern cena-preview.keystore --dir "$RUNNER_TEMP/cena-signing"
          chmod 600 "$RUNNER_TEMP/cena-signing/cena-preview.keystore"
          gh release download cena-v0.7.2 --repo helbermoura2/teclado-br --pattern CENA-0.7.2.apk --dir /tmp/cena-previous
      - name: Compilar testes Android
        working-directory: source/cena/android
        env:
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: gradle --no-daemon -PcenaAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Preparar modelo para teste Android
        run: |
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/23749fefcc72300e3a2ad315e1317431b06b590a/Qwen3-0.6B-Q8_0.gguf?download=true' -o /tmp/cena-smoke.gguf
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/cena-smoke.gguf' | sha256sum -c -
          /tmp/cena-browser/bin/python -c "import yaml,pathlib; d=yaml.safe_load(pathlib.Path('source/.github/workflows/cena-vision-qa.yml').read_text()); s=next(x['with']['script'] for x in d['jobs']['local-model']['steps'] if str(x.get('uses','')).startswith('reactivecircus/android-emulator-runner@')); pathlib.Path('/tmp/cena-native-tests.sh').write_text(s)"
      - name: Preparar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar Android e instalação sobre versão anterior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 4096
          disable-animations: true
          working-directory: source/cena/android
          script: bash /tmp/cena-native-tests.sh
      - name: Conferir reconhecimento das fotos
        working-directory: source/cena
        run: node scripts/check-native-cover-identification.mjs
      - name: Compilar APK para celular
        working-directory: source/cena/android
        env:
          CENA_KEYSTORE_PATH: ${{ runner.temp }}/cena-signing/cena-preview.keystore
        run: |
          rm -f app/src/main/assets/models/clip-vision.onnx
          gradle --no-daemon -PcenaAbi=arm64-v8a assembleDebug
      - name: Verificar conteúdo e assinatura
        working-directory: source/cena
        run: |
          python3 scripts/check-packaged-apk.py android/app/build/outputs/apk/debug/app-debug.apk
          curl -fL --retry 3 'https://github.com/helbermoura2/cena-downloads/releases/download/v0.18.0/CENA-0.18.0.apk' -o /tmp/CENA-0.18.0.apk
          echo '6e401e2dc615786468f94c10f70ff6dc3ba632bb94d5a8a61b5980e5e2635e48  /tmp/CENA-0.18.0.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs /tmp/CENA-0.18.0.apk > /tmp/cena-old-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/cena-new-cert.txt
          python3 -c "from pathlib import Path; import re; get=lambda p:re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',Path(p).read_text()).group(1); assert get('/tmp/cena-old-cert.txt')==get('/tmp/cena-new-cert.txt'), 'Assinatura divergente'"
      - name: Publicar atualização no canal público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp source/cena/android/app/build/outputs/apk/debug/app-debug.apk /tmp/CENA-0.19.0.apk
          gh release create v0.19.0 /tmp/CENA-0.19.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CENA 0.19.0' --notes-file source/cena/docs/CENA-0.19.0.md --latest
